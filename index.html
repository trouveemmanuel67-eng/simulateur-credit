body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(11,10,9,.72),rgba(11,10,9,.9));z-index:-1}
main{max-width:920px;margin:0 auto;padding:28px 16px}
h1{font-weight:300;letter-spacing:.35em;text-align:center;color:var(--gold2);margin:8px 0 4px;font-size:clamp(20px,4vw,32px)}
.sub{text-align:center;color:var(--mut);letter-spacing:.15em;font-size:13px;margin-bottom:24px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);margin:14px 0 6px}label:first-child{margin-top:0}
input[type=text]{width:100%;background:#0e0d0c;border:1px solid var(--line);color:var(--sand);border-radius:10px;padding:12px;font-size:20px;font-family:inherit}
input:focus{outline:none;border-color:var(--gold2)}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0}
button{background:transparent;color:var(--sand);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;cursor:pointer;font-size:14px}
button.on{background:var(--gold);color:#0b0a09;border-color:var(--gold)}button:active{transform:scale(.96)}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--gold)}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.big{font-size:clamp(34px,6vw,48px);color:var(--gold2);font-weight:300;margin:4px 0 14px}
.line{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.line b{font-weight:500}
#copy{width:100%;margin-top:16px;background:var(--gold);color:#0b0a09;border-color:var(--gold);font-size:15px;letter-spacing:.1em}
.note{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
</style></head><body><main>
<h1>SIMULATEUR CRÉDIT</h1><div class="sub">TEAM ZONING</div>
<div class="grid"><div class="card">
<label for="m">Montant à financer (€)</label><input id="m" type="text" inputmode="decimal" value="40 000">
<label>Taux nominal (%)</label><div class="row"><input id="t" type="text" inputmode="decimal" value="4,99"><div class="seg"><button id="ba" class="on">Annuel</button><button id="bm">Mensuel</button></div></div>
<div class="hint" id="conv"></div>
<label>Durée : <span id="dl"></span></label><input id="d" type="range" min="24" max="84" step="1" value="60">
<div class="quick" id="q"></div>
</div><div class="card">
<label>Mensualité</label><div class="big" id="rm">–</div>
<div class="line"><span>Coût total du crédit (intérêts)</span><b id="ri">–</b></div>
<div class="line"><span>Montant total remboursé</span><b id="rt">–</b></div>
<div class="line"><span>Nombre de mensualités</span><b id="rn">–</b></div>
<button id="copy">Copier le résumé</button>
</div></div>
<div class="note">Simulation indicative, non contractuelle. Hors assurance et frais de dossier. Voir avec votre banque les conditions réelles d'un crédit.</div>
</main><script>
const $=id=>document.getElementById(id);let mode='a';
const eur=v=>v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pct=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:4})+' %';
const num=s=>parseFloat(String(s).replace(/[\s\u202f\u00a0€%]/g,'').replace(',','.'));
function calc(P,rm,n){if(!(P>0)||!(n>0))return null;const r=rm/100;const M=r===0?P/n:P*r/(1-Math.pow(1+r,-n));return{M,T:M*n,I:M*n-P}}
function annual(){const t=num($('t').value)||0;return mode==='a'?t:t*12}
function upd(){const P=num($('m').value),n=+$('d').value,ta=annual(),R=calc(P,ta/12,n);
$('dl').textContent=n+' mois ('+(n/12).toLocaleString('fr-FR',{maximumFractionDigits:1})+' ans)';
$('conv').textContent=mode==='a'?'Soit '+pct(ta/12)+' par mois':'Soit '+pct(ta)+' par an';
[...$('q').children].forEach(b=>b.classList.toggle('on',+b.textContent===n));
if(!R){$('rm').textContent=$('ri').textContent=$('rt').textContent='–';return}
$('rm').textContent=eur(R.M);$('ri').textContent=eur(R.I);$('rt').textContent=eur(R.T);$('rn').textContent=n;window._r={P,ta,n,...R}}
[24,36,48,60,72,84].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{$('d').value=v;upd()};$('q').appendChild(b)});
function setMode(m){if(m===mode)return;const t=num($('t').value)||0;$('t').value=(m==='m'?t/12:t*12).toLocaleString('fr-FR',{maximumFractionDigits:4});mode=m;$('ba').classList.toggle('on',m==='a');$('bm').classList.toggle('on',m==='m');upd()}
$('ba').onclick=()=>setMode('a');$('bm').onclick=()=>setMode('m');
['m','t','d'].forEach(i=>$(i).addEventListener('input',upd));
$('m').addEventListener('blur',()=>{const v=num($('m').value);if(v>0)$('m').value=v.toLocaleString('fr-FR',{maximumFractionDigits:2})});
$('copy').onclick=async()=>{const r=window._r;if(!r)return;const s=summary(r);
try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
const b=$('copy');b.textContent='Résumé copié ✓';setTimeout(()=>b.textContent='Copier le résumé',1500)};
function summary(r){const e0=v=>Number.isInteger(Math.round(v*100)/100)?v.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €':eur(v);
return ('Montant financé : '+e0(r.P)+' – Taux annuel : '+pct(r.ta)+' – Durée : '+r.n+' mois – Mensualité : '+eur(r.M)+' – Coût total du crédit : '+eur(r.I)+' – Montant total remboursé : '+eur(r.T)+' (simulation fictive à titre indicative *) Voir avec votre banque les conditions réelles d\'un crédit.').replace(/[\r\n]+/g,' ')}
upd();
</script></body></html>
